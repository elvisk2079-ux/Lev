<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Unit 6 · Часть 4</title>
<style>
:root{--bg:#FFF8EE;--card:#fff;--ink:#2B2B2B;--muted:#7a7468;--green:#2E8B57;--green2:#E3F4EA;--orange:#FF8C42;--orange2:#FFE9D9;--red:#E04848;--red2:#FDE3E3;--line:#EADFCF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px}
header{background:linear-gradient(135deg,#2E8B57,#46A86F);color:#fff;padding:18px 16px 14px;text-align:center}
header .unit{font-size:14px;opacity:.9;letter-spacing:.5px}
header h1{margin:4px 0 2px;font-size:24px}
header .parts{margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
header .parts a{color:#fff;text-decoration:none;font-size:14px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.18)}
header .parts a.cur{background:#fff;color:var(--green);font-weight:700}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
main{max-width:760px;margin:0 auto;padding:16px}
.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(80,60,20,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:21px}
.prog{color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:5px;margin:12px 0 18px;overflow:hidden}
.bar div{height:100%;background:var(--green);transition:width .3s}
.q{text-align:center;margin:10px 0 18px}
.word{font-size:32px;font-weight:700}
.ipa{color:var(--muted);font-size:18px;margin-top:4px}
.ru{font-size:26px;font-weight:600}
.note{background:var(--orange2);border-radius:10px;padding:8px 12px;font-size:15px;margin-top:10px;display:inline-block}
.sent{font-size:23px;line-height:1.5}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--orange);color:var(--orange);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:18px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--orange)}
.good{background:var(--green2)!important;border-color:var(--green)!important}
.bad{background:var(--red2)!important;border-color:var(--red)!important}
.fb{min-height:28px;margin-top:14px;text-align:center;font-size:17px}
.fb .ok{color:var(--green);font-weight:700}.fb .no{color:var(--red);font-weight:700}
.say,.bigsay{border:none;background:var(--orange2);border-radius:50%;cursor:pointer}
.say{width:40px;height:40px;font-size:19px;vertical-align:middle}
.bigsay{width:96px;height:96px;font-size:44px}
.btn{border:none;background:var(--green);color:#fff;border-radius:14px;padding:12px 18px;font-size:17px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--orange)}.btn.ghost{background:#eee;color:var(--ink)}.btn.small{padding:8px 12px;font-size:15px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
input.inp,textarea.inp{width:100%;font-size:22px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;outline:none;font-family:inherit}
input.inp:focus,textarea.inp:focus{border-color:var(--orange)}
textarea.inp{font-size:19px;min-height:80px;resize:vertical}
.mask{font-family:"Courier New",monospace;font-size:26px;letter-spacing:4px;text-align:center;margin:6px 0 14px;color:var(--green);font-weight:700}
.center{text-align:center}
.stars{font-size:48px}.big{font-size:28px;font-weight:700}
/* cards */
.flip{perspective:1000px;cursor:pointer;margin:0 auto;max-width:520px}
.flip .inner{position:relative;height:290px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.front{background:linear-gradient(135deg,#FFE9D9,#FFF4EA);border:3px solid var(--orange)}
.back{background:linear-gradient(135deg,#E3F4EA,#F3FBF6);border:3px solid var(--green);transform:rotateY(180deg)}
.ex{margin-top:14px;font-size:17px}.exru{color:var(--muted);font-size:15px;margin-top:4px}
.counter{text-align:center;color:var(--muted);margin:10px 0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.ip{color:var(--muted);font-size:14px}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-size:16px;cursor:pointer;min-height:54px;color:var(--ink)}
.tile.sel{border-color:var(--orange);background:var(--orange2)}
.tile.done{background:var(--green2);border-color:var(--green);opacity:.45;cursor:default}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* builder */
.line{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--orange);background:#fff;border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer;color:var(--ink)}
.line .chip{border-color:var(--green);background:var(--green2)}
.answer{background:var(--green2);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:19px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
</style>
</head>
<body>
<header>
  <div class="unit">Gateway A2 · Unit 6 · EAT WELL, LIVE WELL · p. 79</div>
  <h1>Words — Часть 4 (слова 37–48)</h1>
  <div class="parts"><a href="part1.html">Часть 1</a><a href="part2.html">Часть 2</a><a href="part3.html">Часть 3</a><a href="part4.html" class="cur">Часть 4</a><a href="all-words.html">Все слова</a></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>Слова по тексту «What's in your food?» · удачи на понедельнике, Лев! 💪</footer>
<script>
const W=[{"w": "special", "ipa": "/ˈspeʃl/", "ru": "специальный, особенный", "ex": "This is a special cake for my birthday.", "ga": "special", "exRu": "Это особенный торт на мой день рождения.", "note": ""}, {"w": "a scientist", "ipa": "/ˈsaɪəntɪst/", "ru": "учёный", "ex": "A scientist works in a laboratory.", "ga": "scientist", "exRu": "Учёный работает в лаборатории.", "note": ""}, {"w": "a laboratory", "ipa": "/ləˈbɒrət(ə)ri/", "ru": "лаборатория", "ex": "They test food in a laboratory.", "ga": "laboratory", "exRu": "Они проверяют еду в лаборатории.", "note": ""}, {"w": "to mean", "ipa": "/miːn/", "ru": "означать", "ex": "What does this word mean?", "ga": "mean", "exRu": "Что означает это слово?", "note": ""}, {"w": "in the end", "ipa": "/ɪn ði ˈend/", "ru": "в конечном итоге, в конце концов", "ex": "In the end, we ate pizza.", "ga": "In the end", "exRu": "В конце концов мы съели пиццу.", "note": ""}, {"w": "typical", "ipa": "/ˈtɪpɪkl/", "ru": "типичный", "ex": "Porridge is a typical Russian breakfast.", "ga": "typical", "exRu": "Каша — типичный русский завтрак.", "note": ""}, {"w": "delicious", "ipa": "/dɪˈlɪʃəs/", "ru": "изумительно вкусный", "ex": "Mum's soup is delicious!", "ga": "delicious", "exRu": "Мамин суп изумительно вкусный!", "note": ""}, {"w": "simple", "ipa": "/ˈsɪmpl/", "ru": "простой", "ex": "This recipe is very simple.", "ga": "simple", "exRu": "Этот рецепт очень простой.", "note": ""}, {"w": "to explain", "ipa": "/ɪkˈspleɪn/", "ru": "объяснять", "ex": "Can you explain this word?", "ga": "explain", "exRu": "Можешь объяснить это слово?", "note": ""}, {"w": "advice", "ipa": "/ədˈvaɪs/", "ru": "совет", "ex": "The doctor gave me good advice.", "ga": "advice", "exRu": "Врач дал мне хороший совет.", "note": "Всегда в единственном числе: some advice, good advice (НЕ advices, НЕ an advice)"}, {"w": "a list", "ipa": "/lɪst/", "ru": "список", "ex": "Make a shopping list.", "ga": "list", "exRu": "Составь список покупок.", "note": ""}, {"w": "carefully", "ipa": "/ˈkeəfəli/", "ru": "внимательно, осторожно", "ex": "Read the label carefully.", "ga": "carefully", "exRu": "Внимательно прочитай этикетку.", "note": ""}].map((w,i)=>Object.assign({id:i},w));
const TEST_N=12;
const $=s=>document.querySelector(s);
const app=$('#app');
let token=0;
function later(fn,ms){const t=token;setTimeout(()=>{if(t===token)fn();},ms);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function others(w,n){return shuffle(W.filter(x=>x.id!==w.id)).slice(0,n);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-GB')||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t,rate){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=rate||0.9;speechSynthesis.speak(u);}catch(e){}}
function sayBtn(t){return `<button class="say" data-t="${esc(t)}" title="Послушать">🔊</button>`;}
function bindSay(){app.querySelectorAll('.say').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.t);});}
function core(s){s=s.toLowerCase().replace(/[’`]/g,"'").replace(/flavor/g,'flavour').trim().replace(/\s+/g,' ');return s.replace(/^(to|a|an) /,'');}
const CONTR=[["don't","do not"],["doesn't","does not"],["it's","it is"],["can't","cannot"],["can not","cannot"],["i'm","i am"],["isn't","is not"],["what's","what is"]];
function normSent(s){s=' '+s.toLowerCase().replace(/[’`]/g,"'").replace(/flavor/g,'flavour')+' ';CONTR.forEach(([a,b])=>{s=s.split(a).join(b);});return s.replace(/[.,!?;:"«»]/g,' ').replace(/\s+/g,' ').trim();}
function gapHtml(w){const re=new RegExp('\\b'+w.ga.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');return esc(w.ex.replace(re,'@@')).replace('@@','<span class="gap">&nbsp;?&nbsp;</span>');}
function head(title,i,n,score){return `<div class="top"><h2>${title}</h2><div class="prog">${i+1} / ${n} · ✅ ${score}</div></div><div class="bar"><div style="width:${i/n*100}%"></div></div>`;}

/* ---------- result ---------- */
function result(s,t,retry,retryWrong,extra){
  const p=t?s/t:0;
  const stars=p>=.9?'⭐⭐⭐':p>=.7?'⭐⭐':p>=.5?'⭐':'💪';
  const msg=p>=.9?'Отлично!':p>=.7?'Хорошо!':p>=.5?'Неплохо, но надо ещё потренироваться':'Давай ещё раз!';
  app.innerHTML=`<div class="panel center"><div class="stars">${stars}</div><h2>${msg}</h2><p class="big">${s} из ${t}</p>${extra||''}
  <div class="row"><button class="btn" id="r1">🔄 Ещё раз</button>${retryWrong?'<button class="btn alt" id="r2">🎯 Повторить ошибки</button>':''}</div></div>`;
  $('#r1').onclick=retry; if(retryWrong) $('#r2').onclick=retryWrong;
}

/* ---------- choice quiz engine ---------- */
function quiz(gen,title){
  const qs=gen(); let i=0,score=0; const wrong=[];
  function show(){
    if(i>=qs.length) return result(score,qs.length,()=>quiz(gen,title),wrong.length?()=>quiz(()=>shuffle(wrong),title+' · ошибки'):null);
    const q=qs[i];
    app.innerHTML=`<div class="panel">${head(title,i,qs.length,score)}<div class="q">${q.html}</div>
      <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
    bindSay(); if(q.autoSay) speak(q.autoSay);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=q.options[b.dataset.k]===q.answer;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.options[x.dataset.k]===q.answer)x.classList.add('good');});
      if(ok){score++;}else{b.classList.add('bad');wrong.push(q);}
      $('#fb').innerHTML=(ok?'<span class="ok">✓ Правильно!</span>':'<span class="no">✗ Ошибка</span>')+(q.after?'<div style="margin-top:6px">'+q.after+'</div>':'');
      if(q.afterSay) speak(q.afterSay);
      later(()=>{i++;show();},ok?1100:2600);
    });
  }
  show();
}
function qEnRu(w){return{html:`<div class="word">${esc(w.w)} ${sayBtn(w.w)}</div><div class="ipa">${esc(w.ipa)}</div>`,options:shuffle([w.ru,...others(w,3).map(x=>x.ru)]),answer:w.ru,autoSay:w.w};}
function qRuEn(w){return{html:`<div class="ru">${esc(w.ru)}</div>`,options:shuffle([w.w,...others(w,3).map(x=>x.w)]),answer:w.w,afterSay:w.w};}
function qGap(w){return{html:`<div class="sent">${gapHtml(w)}</div>`,options:shuffle([w.ga.toLowerCase(),...others(w,3).map(x=>x.ga.toLowerCase())]),answer:w.ga.toLowerCase(),after:`<b>${esc(w.ex)}</b><br><span style="color:#7a7468">${esc(w.exRu)}</span>`,afterSay:w.ex};}

/* ---------- cards ---------- */
function cards(){
  let order=W.slice(),i=0,ruFirst=false;
  function show(){
    const w=order[i];
    const en=`<div class="word">${esc(w.w)}</div><div class="ipa">${esc(w.ipa)}</div><div style="margin-top:12px">${sayBtn(w.w)}</div>`;
    const ru=`<div class="ru">${esc(w.ru)}</div>${w.note?`<div class="note">⚠️ ${esc(w.note)}</div>`:''}<div class="ex">${esc(w.ex)} ${sayBtn(w.ex)}</div><div class="exru">${esc(w.exRu)}</div>`;
    app.innerHTML=`<div class="panel"><div class="top"><h2>🃏 Карточки</h2><div class="prog">нажми на карточку, чтобы перевернуть</div></div>
     <div class="flip" id="card" style="margin-top:16px"><div class="inner"><div class="face front">${ruFirst?`<div class="ru">${esc(w.ru)}</div>`:en}</div><div class="face back">${ruFirst?en+`<div class="ex">${esc(w.ex)} ${sayBtn(w.ex)}</div><div class="exru">${esc(w.exRu)}</div>`:ru}</div></div></div>
     <div class="counter">${i+1} / ${order.length}</div>
     <div class="row"><button class="btn ghost" id="pv">◀</button><button class="btn" id="fl">Перевернуть</button><button class="btn ghost" id="nx">▶</button></div>
     <div class="row"><button class="btn alt small" id="mix">🔀 Перемешать</button><button class="btn alt small" id="side">${ruFirst?'Сначала английский':'Сначала русский'}</button></div></div>
     <div class="panel" style="margin-top:16px"><h2>📋 Все слова этой части</h2><table>${W.map(x=>`<tr><td><b>${esc(x.w)}</b></td><td class="ip">${esc(x.ipa)}</td><td>${esc(x.ru)}</td><td>${sayBtn(x.w)}</td></tr>`).join('')}</table></div>`;
    bindSay();
    const c=$('#card'); c.onclick=()=>c.classList.toggle('on');
    $('#fl').onclick=()=>c.classList.toggle('on');
    $('#pv').onclick=()=>{i=(i-1+order.length)%order.length;show();};
    $('#nx').onclick=()=>{i=(i+1)%order.length;show();};
    $('#mix').onclick=()=>{order=shuffle(W);i=0;show();};
    $('#side').onclick=()=>{ruFirst=!ruFirst;show();};
    if(!ruFirst) speak(w.w);
  }
  document.onkeydown=e=>{if(cur!=='cards')return;if(e.key==='ArrowRight')$('#nx').click();if(e.key==='ArrowLeft')$('#pv').click();if(e.key===' '){e.preventDefault();$('#card').classList.toggle('on');}};
  show();
}

/* ---------- matching ---------- */
function matching(){
  const all=shuffle(W),rounds=[];for(let k=0;k<all.length;k+=6)rounds.push(all.slice(k,k+6));
  let r=0,mistakes=0;
  function show(){
    if(r>=rounds.length){
      app.innerHTML=`<div class="panel center"><div class="stars">${mistakes===0?'⭐⭐⭐':mistakes<=3?'⭐⭐':'⭐'}</div><h2>Все пары собраны!</h2><p class="big">Ошибок: ${mistakes}</p><div class="row"><button class="btn" id="r1">🔄 Ещё раз</button></div></div>`;
      $('#r1').onclick=matching;return;
    }
    const set=rounds[r],L=shuffle(set),R=shuffle(set);let sel=null,done=0;
    app.innerHTML=`<div class="panel"><div class="top"><h2>🔗 Найди пару</h2><div class="prog">раунд ${r+1} / ${rounds.length} · ошибок: ${mistakes}</div></div><div class="bar"><div style="width:${r/rounds.length*100}%"></div></div>
     <div class="match"><div class="col">${L.map(w=>`<button class="tile" data-s="L" data-id="${w.id}">${esc(w.w)}</button>`).join('')}</div>
     <div class="col">${R.map(w=>`<button class="tile" data-s="R" data-id="${w.id}">${esc(w.ru)}</button>`).join('')}</div></div></div>`;
    app.querySelectorAll('.tile[data-s=L]').forEach(t=>t.onclick=()=>{if(t.classList.contains('done'))return;app.querySelectorAll('.tile[data-s=L]').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=t;speak(t.textContent);});
    app.querySelectorAll('.tile[data-s=R]').forEach(t=>t.onclick=()=>{
      if(!sel||t.classList.contains('done'))return;
      if(sel.dataset.id===t.dataset.id){[sel,t].forEach(x=>{x.classList.remove('sel');x.classList.add('done');});sel=null;done++;if(done===set.length){r++;later(show,700);}}
      else{mistakes++;t.classList.add('bad','shake');setTimeout(()=>t.classList.remove('bad','shake'),500);}
    });
  }
  show();
}

/* ---------- write the word / listen and write ---------- */
function maskOf(a,n){return a.split('').map((c,k)=>c===' '?'&nbsp;&nbsp;':(k<n?esc(c):'_')).join(' ');}
function writeEx(mode,list){
  const qs=shuffle(list||W);let i=0,score=0;const wrong=[];
  const title=mode==='listen'?'🎧 Слушай и пиши':'✏️ Напиши слово';
  function show(){
    if(i>=qs.length) return result(score,qs.length,()=>writeEx(mode),wrong.length?()=>writeEx(mode,wrong):null);
    const w=qs[i],ans=core(w.w);let tries=0,hints=0,locked=false;
    app.innerHTML=`<div class="panel">${head(title,i,qs.length,score)}
     <div class="q">${mode==='listen'?`<button class="bigsay" id="s1">🔊</button><div class="row"><button class="btn ghost small" id="s2">🐢 медленно</button></div>`:`<div class="ru">${esc(w.ru)}</div>`}</div>
     <div class="mask" id="mask">${maskOf(ans,0)}</div>
     <input class="inp" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="пиши по-английски (без to / a / an)">
     <div class="row" id="btns"><button class="btn" id="chk">Проверить</button><button class="btn alt" id="hint">💡 Подсказка</button><button class="btn ghost" id="skip">Не знаю</button></div>
     <div class="fb" id="fb"></div></div>`;
    const inp=$('#inp');inp.focus();
    if(mode==='listen'){speak(w.w,0.85);$('#s1').onclick=()=>speak(w.w,0.85);$('#s2').onclick=()=>speak(w.w,0.5);}
    const reveal=ok=>{locked=true;$('#mask').innerHTML=maskOf(ans,ans.length);
      $('#fb').innerHTML=(ok?'<span class="ok">✓ Правильно!</span> ':'<span class="no">Правильно так:</span> ')+`<b>${esc(w.w)}</b> — ${esc(w.ru)}`;
      speak(w.w);
      if(ok){later(()=>{i++;show();},1300);}
      else{$('#btns').innerHTML='<button class="btn" id="nx">Дальше ➜</button>';$('#nx').onclick=()=>{i++;show();};$('#nx').focus();}};
    const check=()=>{if(locked)return;const v=core(inp.value);if(!v)return;
      if(v===ans){if(tries===0&&hints===0)score++;else wrong.push(w);inp.classList.add('good');reveal(true);}
      else{tries++;inp.classList.add('bad');setTimeout(()=>inp.classList.remove('bad'),600);
        if(tries>=2){wrong.push(w);reveal(false);}else $('#fb').innerHTML='<span class="no">Не так, попробуй ещё раз</span>';}};
    $('#chk').onclick=check;
    $('#hint').onclick=()=>{hints++;$('#mask').innerHTML=maskOf(ans,Math.min(hints,ans.length));inp.focus();};
    $('#skip').onclick=()=>{wrong.push(w);reveal(false);};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
  }
  show();
}

/* ---------- build the sentence ---------- */
function builder(list){
  const qs=shuffle(list||W);let i=0,score=0;const wrong=[];
  function show(){
    if(i>=qs.length) return result(score,qs.length,()=>builder(),wrong.length?()=>builder(wrong):null);
    const w=qs[i];const target=w.ex.replace(/[.!?]$/,'').split(' ');const mark=(w.ex.match(/[.!?]$/)||['.'])[0];
    let bank=shuffle(target.map((t,k)=>({t,k}))),line=[],locked=false;
    function draw(){
      app.innerHTML=`<div class="panel">${head('🧩 Собери предложение',i,qs.length,score)}
       <div class="q"><div class="ru" style="font-size:22px">${esc(w.exRu)}</div></div>
       <div class="line" id="line">${line.map((c,k)=>`<button class="chip" data-k="${k}">${esc(c.t)}</button>`).join('')}<span style="font-size:20px">${line.length===target.length?esc(mark):''}</span></div>
       <div class="bank">${bank.map((c,k)=>`<button class="chip" data-b="${k}">${esc(c.t)}</button>`).join('')}</div>
       <div class="row" id="btns"><button class="btn" id="chk" ${line.length<target.length?'disabled style="opacity:.5"':''}>Проверить</button><button class="btn ghost" id="clr">Сбросить</button></div>
       <div class="fb" id="fb"></div></div>`;
      if(locked)return;
      app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{line.push(bank.splice(+b.dataset.b,1)[0]);draw();});
      app.querySelectorAll('#line [data-k]').forEach(b=>b.onclick=()=>{bank.push(line.splice(+b.dataset.k,1)[0]);draw();});
      $('#clr').onclick=()=>{bank=shuffle(target.map((t,k)=>({t,k})));line=[];draw();};
      $('#chk').onclick=()=>{
        const ok=line.map(c=>c.t).join(' ').toLowerCase()===target.join(' ').toLowerCase();
        locked=true;
        if(ok){score++;$('#line').classList.add('good');$('#fb').innerHTML='<span class="ok">✓ Отлично!</span>';speak(w.ex);later(()=>{i++;show();},1600);}
        else{wrong.push(w);$('#line').classList.add('bad');$('#fb').innerHTML=`<span class="no">Не совсем. Правильно:</span><div class="answer">${esc(w.ex)} ${sayBtn(w.ex)}</div>`;bindSay();speak(w.ex);
          $('#btns').innerHTML='<button class="btn" id="nx">Дальше ➜</button>';$('#nx').onclick=()=>{i++;show();};}
      };
    }
    draw();
  }
  show();
}

/* ---------- translate the sentence ---------- */
function translate(list){
  const qs=shuffle(list||W);let i=0,score=0;const wrong=[];
  function show(){
    if(i>=qs.length) return result(score,qs.length,()=>translate(),wrong.length?()=>translate(wrong):null);
    const w=qs[i];
    app.innerHTML=`<div class="panel">${head('🇷🇺→🇬🇧 Переведи предложение',i,qs.length,score)}
     <div class="q"><div class="ru" style="font-size:23px">${esc(w.exRu)}</div><div id="hb" style="margin-top:10px"></div></div>
     <textarea class="inp" id="inp" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="Напиши по-английски…"></textarea>
     <div class="row" id="btns"><button class="btn" id="chk">Проверить</button><button class="btn alt" id="hint">💡 Подсказка</button><button class="btn ghost" id="show">Показать ответ</button></div>
     <div class="fb" id="fb"></div></div>`;
    const inp=$('#inp');inp.focus();
    $('#hint').onclick=()=>{$('#hb').innerHTML=`<span class="note">Нужное слово: <b>${esc(w.w)}</b> — ${esc(w.ru)}</span>`;};
    const next=()=>{i++;show();};
    const showAns=(msg)=>{
      $('#fb').innerHTML=`<span class="no">${msg}</span><div class="answer">${esc(w.ex)} ${sayBtn(w.ex)}</div>`;bindSay();speak(w.ex);
      $('#btns').innerHTML='<button class="btn" id="same">✅ У меня так же</button><button class="btn ghost" id="nx">Я ошибся ➜</button>';
      $('#same').onclick=()=>{score++;next();};$('#nx').onclick=()=>{wrong.push(w);next();};
    };
    $('#chk').onclick=()=>{
      if(!inp.value.trim())return;
      if(normSent(inp.value)===normSent(w.ex)){score++;inp.classList.add('good');$('#fb').innerHTML=`<span class="ok">✓ Отлично!</span><div class="answer">${esc(w.ex)}</div>`;speak(w.ex);
        $('#btns').innerHTML='<button class="btn" id="nx">Дальше ➜</button>';$('#nx').onclick=next;$('#nx').focus();}
      else showAns('Сравни со своим вариантом:');
    };
    $('#show').onclick=()=>showAns('Правильный ответ:');
    inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chk')&&$('#chk').click();}};
  }
  show();
}

/* ---------- final test ---------- */
function genTest(){const gens=[qEnRu,qRuEn,qGap];return shuffle(W).slice(0,TEST_N).map((w,k)=>gens[k%3](w)).sort(()=>Math.random()-.5);}
function test(){
  quiz(genTest,'🏆 Итоговый тест');
}
