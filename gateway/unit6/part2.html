<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Unit 6 · Часть 2</title>
<style>
:root{--bg:#FFF8EE;--card:#fff;--ink:#2B2B2B;--muted:#7a7468;--green:#2E8B57;--green2:#E3F4EA;--orange:#FF8C42;--orange2:#FFE9D9;--red:#E04848;--red2:#FDE3E3;--line:#EADFCF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px}
header{background:linear-gradient(135deg,#2E8B57,#46A86F);color:#fff;padding:18px 16px 14px;text-align:center}
header .unit{font-size:14px;opacity:.9;letter-spacing:.5px}
header h1{margin:4px 0 2px;font-size:24px}
.parts.bottom{text-align:center;padding:10px 16px 0}
.parts.bottom a{display:inline-block;margin:4px;color:var(--green);text-decoration:none;font-size:16px;padding:8px 14px;border-radius:20px;background:#fff;border:2px solid var(--green)}
.parts.bottom a.cur{background:var(--green);color:#fff;font-weight:700}
main{max-width:780px;margin:0 auto;padding:16px}
section.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(80,60,20,.08);margin-bottom:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}
.desc{color:var(--muted);margin:6px 0 14px;font-size:16px}
.prog{font-size:15px;font-weight:700;color:var(--green);background:var(--green2);border-radius:20px;padding:4px 12px}
.prog:empty{display:none}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--orange2);color:#b8561a;font-size:14px;font-weight:700;flex:0 0 28px;margin-right:6px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:none}
.qq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:20px}
.qq .w{font-weight:700;font-size:22px}.qq .ip{color:var(--muted);font-size:16px}
.sent{font-size:20px;line-height:1.5}
.gap{display:inline-block;min-width:80px;border-bottom:3px solid var(--orange);color:var(--orange);font-weight:700;text-align:center}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--orange)}
.good{background:var(--green2)!important;border-color:var(--green)!important}
.bad{background:var(--red2)!important;border-color:var(--red)!important}
.after{font-size:16px;margin-top:8px}
.after:empty{display:none}
.after .ok{color:var(--green);font-weight:700}.after .no{color:var(--red);font-weight:700}
.after .tr{color:var(--muted)}
.say{border:none;background:var(--orange2);border-radius:50%;cursor:pointer;width:38px;height:38px;font-size:18px;flex:0 0 38px}
.say.slow{background:#eee;font-size:16px}
.btn{border:none;background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:16px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--orange)}.btn.ghost{background:#eee;color:var(--ink)}.btn.small{padding:7px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wr .ru{font-size:19px;font-weight:600;min-width:200px;flex:1 1 200px}
.wr .field{display:flex;gap:6px;flex:1 1 280px;align-items:center}
input.inp,textarea.inp{width:100%;font-size:19px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;outline:none;font-family:inherit}
input.inp:focus,textarea.inp:focus{border-color:var(--orange)}
textarea.inp{min-height:62px;resize:vertical}
.mask{font-family:"Courier New",monospace;letter-spacing:3px;color:var(--green);font-weight:700;font-size:17px}
.center{text-align:center}
.stars{font-size:44px}.big{font-size:26px;font-weight:700}
/* cards */
.flip{perspective:1000px;cursor:pointer;margin:0 auto;max-width:520px}
.flip .inner{position:relative;height:270px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.front{background:linear-gradient(135deg,#FFE9D9,#FFF4EA);border:3px solid var(--orange)}
.back{background:linear-gradient(135deg,#E3F4EA,#F3FBF6);border:3px solid var(--green);transform:rotateY(180deg)}
.bigw{font-size:32px;font-weight:700}.bigru{font-size:25px;font-weight:600}
.note{background:var(--orange2);border-radius:10px;padding:6px 10px;font-size:14px;margin-top:8px;display:inline-block}
.ex{margin-top:12px;font-size:17px}.exru{color:var(--muted);font-size:15px;margin-top:4px}
.counter{text-align:center;color:var(--muted);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:16px}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.ip{color:var(--muted);font-size:14px}
td.n{color:var(--muted);font-size:14px;width:28px}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font-size:16px;cursor:pointer;min-height:50px;color:var(--ink)}
.tile.sel{border-color:var(--orange);background:var(--orange2)}
.tile.done{background:var(--green2);border-color:var(--green);opacity:.45;cursor:default}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* builder */
.line{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--orange);background:#fff;border-radius:10px;padding:6px 10px;font-size:17px;cursor:pointer;color:var(--ink)}
.line .chip{border-color:var(--green);background:var(--green2)}
.answer{background:var(--green2);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* test */
.tq{text-align:center;margin:8px 0 16px;font-size:22px}
.bar{height:8px;background:var(--line);border-radius:5px;margin:4px 0 14px;overflow:hidden}
.bar div{height:100%;background:var(--green);transition:width .3s}
.totop{position:fixed;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 24px 40px}
</style>
</head>
<body>
<header>
  <div class="unit">Gateway A2 · Unit 6 · EAT WELL, LIVE WELL · p. 79</div>
  <h1>Words — Часть 2 (слова 13–24)</h1>
</header>
<main id="main"></main>
<div class="parts bottom"><div style="margin-bottom:8px;color:#7a7468">Другие части:</div><a href="part1.html">Часть 1</a><a href="part2.html" class="cur">Часть 2</a><a href="part3.html">Часть 3</a><a href="part4.html">Часть 4</a><a href="all-words.html">Все слова</a></div>
<footer>Слова по тексту «What's in your food?» · удачи в понедельник, Лев! 💪</footer>
<button class="totop" onclick="window.scrollTo({top:0})" title="Наверх">↑</button>
<script>
const W=[{"w": "to include", "ipa": "/ɪnˈkluːd/", "ru": "включать", "ex": "The menu includes salads and soups.", "ga": "includes", "exRu": "Меню включает салаты и супы.", "note": ""}, {"w": "flavour", "ipa": "/ˈfleɪvə/", "ru": "вкус", "ex": "Strawberry is my favourite ice cream flavour.", "ga": "flavour", "exRu": "Клубника — мой любимый вкус мороженого.", "note": ""}, {"w": "a preservative", "ipa": "/prɪˈzɜːvətɪv/", "ru": "консервант", "ex": "A preservative helps food stay fresh.", "ga": "preservative", "exRu": "Консервант помогает еде оставаться свежей.", "note": ""}, {"w": "to go bad", "ipa": "/ɡəʊ ˈbæd/", "ru": "испортиться", "ex": "Milk can go bad quickly.", "ga": "go bad", "exRu": "Молоко может быстро испортиться.", "note": ""}, {"w": "an antioxidant", "ipa": "/ˌæntiˈɒksɪd(ə)nt/", "ru": "антиоксидант", "ex": "Vitamin C is an antioxidant.", "ga": "antioxidant", "exRu": "Витамин C — антиоксидант.", "note": ""}, {"w": "to protect", "ipa": "/prəˈtekt/", "ru": "защищать", "ex": "Vegetables protect our body.", "ga": "protect", "exRu": "Овощи защищают наш организм.", "note": ""}, {"w": "oxygen", "ipa": "/ˈɒksɪdʒ(ə)n/", "ru": "кислород", "ex": "We need oxygen to live.", "ga": "oxygen", "exRu": "Нам нужен кислород, чтобы жить.", "note": ""}, {"w": "to choose", "ipa": "/tʃuːz/", "ru": "выбирать", "ex": "Choose a healthy snack.", "ga": "Choose", "exRu": "Выбери полезный перекус.", "note": ""}, {"w": "different", "ipa": "/ˈdɪfrənt/", "ru": "разный, отличающийся", "ex": "We eat different food every day.", "ga": "different", "exRu": "Мы едим разную еду каждый день.", "note": ""}, {"w": "a possibility", "ipa": "/ˌpɒsəˈbɪləti/", "ru": "возможность", "ex": "Is there a possibility to buy fruit at school?", "ga": "possibility", "exRu": "Есть ли возможность купить фрукты в школе?", "note": ""}, {"w": "to contain", "ipa": "/kənˈteɪn/", "ru": "содержать (в себе что-то)", "ex": "Chocolate contains a lot of sugar.", "ga": "contains", "exRu": "Шоколад содержит много сахара.", "note": ""}, {"w": "a hormone", "ipa": "/ˈhɔːməʊn/", "ru": "гормон", "ex": "Some farmers give hormones to animals.", "ga": "hormones", "exRu": "Некоторые фермеры дают животным гормоны.", "note": ""}].map((w,i)=>Object.assign({id:i},w));
const TEST_N=12;
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function others(w,n){return shuffle(W.filter(x=>x.id!==w.id)).slice(0,n);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-GB')||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t,rate){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=rate||0.9;speechSynthesis.speak(u);}catch(e){}}
function sayBtn(t,slow){return `<button class="say${slow?' slow':''}" data-t="${esc(t)}"${slow?' data-slow="1"':''} title="Послушать">${slow?'🐢':'🔊'}</button>`;}
function bindSay(el){$$('.say',el).forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.t,b.dataset.slow?0.5:0.85);});}
function core(s){s=s.toLowerCase().replace(/[’`]/g,"'").replace(/flavor/g,'flavour').trim().replace(/\s+/g,' ');return s.replace(/^(to|a|an) /,'');}
const CONTR=[["don't","do not"],["doesn't","does not"],["it's","it is"],["can't","cannot"],["can not","cannot"],["i'm","i am"],["isn't","is not"],["what's","what is"]];
function normSent(s){s=' '+s.toLowerCase().replace(/[’`]/g,"'").replace(/flavor/g,'flavour')+' ';CONTR.forEach(([a,b])=>{s=s.split(a).join(b);});return s.replace(/[.,!?;:"«»]/g,' ').replace(/\s+/g,' ').trim();}
function gapHtml(w){const re=new RegExp('\\b'+w.ga.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');return esc(w.ex.replace(re,'@@')).replace('@@','<span class="gap">?</span>');}
function maskOf(a,n){return a.split('').map((c,k)=>c===' '?'&nbsp;':(k<n?esc(c):'_')).join('');}
function stars(p){return p>=.9?'⭐⭐⭐':p>=.7?'⭐⭐':p>=.5?'⭐':'💪';}

/* ---------- section scaffold ---------- */
const SECTIONS=[];const NOLINK={classList:{add(){},remove(){}}};
function addSection(key,title,short,desc,render){SECTIONS.push({key,title,short,desc,render});}
function tracker(sec,total){
  let ok=0,done=0;const prog=$('.prog',sec.el),link=NOLINK;
  prog.textContent='';link.classList.remove('ok');
  return{mark(good){done++;if(good)ok++;prog.textContent=`✅ ${ok} / ${total}`+(done>=total?'  '+stars(ok/total):'');if(done>=total)link.classList.add('ok');}};
}
function buildPage(){
  const main=$('#main');
  SECTIONS.forEach((s,k)=>{
    s.n=k+1;
    main.insertAdjacentHTML('beforeend',`<section class="panel" id="${s.key}"><div class="top"><h2>${s.n}. ${s.title}</h2><div class="prog"></div></div><p class="desc">${s.desc}</p><div class="body"></div>
      ${s.noReset?'':'<div class="row"><button class="btn ghost small reset">🔄 Начать заново (перемешать)</button></div>'}</section>`);
    s.el=$('#'+s.key);s.body=$('.body',s.el);
    const r=$('.reset',s.el);if(r)r.onclick=()=>{s.render(s.body,s);};
    s.render(s.body,s);
  });
}

/* ---------- 1. word list ---------- */
addSection('list','Список слов','Список','Прочитай и послушай все слова. Нажимай 🔊.',(b)=>{
  b.innerHTML=`<table>${W.map((x,k)=>`<tr><td class="n">${k+1}</td><td><b>${esc(x.w)}</b></td><td class="ip">${esc(x.ipa)}</td><td>${esc(x.ru)}${x.note?`<br><span class="note">⚠️ ${esc(x.note)}</span>`:''}</td><td>${sayBtn(x.w)}</td></tr>`).join('')}</table>`;
  bindSay(b);
});
SECTIONS[0].noReset=true;

/* ---------- 2. cards ---------- */
addSection('cards','Карточки','Карточки','Нажми на карточку, чтобы перевернуть. Стрелки ◀ ▶ — листать.',(b)=>{
  let order=W.slice(),i=0,ruFirst=false;
  function show(){
    const w=order[i];
    const en=`<div class="bigw">${esc(w.w)}</div><div class="ip" style="color:#7a7468">${esc(w.ipa)}</div><div style="margin-top:10px">${sayBtn(w.w)}</div>`;
    const exb=`<div class="ex">${esc(w.ex)} ${sayBtn(w.ex)}</div><div class="exru">${esc(w.exRu)}</div>`;
    const ru=`<div class="bigru">${esc(w.ru)}</div>${w.note?`<div class="note">⚠️ ${esc(w.note)}</div>`:''}${exb}`;
    b.innerHTML=`<div class="flip"><div class="inner"><div class="face front">${ruFirst?`<div class="bigru">${esc(w.ru)}</div>`:en}</div><div class="face back">${ruFirst?en+exb:ru}</div></div></div>
     <div class="counter">${i+1} / ${order.length}</div>
     <div class="row"><button class="btn ghost" data-a="pv">◀</button><button class="btn" data-a="fl">Перевернуть</button><button class="btn ghost" data-a="nx">▶</button></div>
     <div class="row"><button class="btn alt small" data-a="mix">🔀 Перемешать</button><button class="btn alt small" data-a="side">${ruFirst?'Сначала английский':'Сначала русский'}</button></div>`;
    bindSay(b);
    const c=$('.flip',b);c.onclick=()=>c.classList.toggle('on');
    const act={pv:()=>{i=(i-1+order.length)%order.length;show();speakFront();},nx:()=>{i=(i+1)%order.length;show();speakFront();},fl:()=>c.classList.toggle('on'),mix:()=>{order=shuffle(W);i=0;show();},side:()=>{ruFirst=!ruFirst;show();}};
    $$('[data-a]',b).forEach(x=>x.onclick=act[x.dataset.a]);
  }
  function speakFront(){if(!ruFirst)speak(order[i].w);}
  show();
});

/* ---------- choice list (used by 3, 4, 6) ---------- */
function choiceList(b,s,items){
  const tr=tracker(s,items.length);
  b.innerHTML=items.map((q,n)=>`<div class="item" data-n="${n}"><div class="qq"><span class="num">${n+1}</span>${q.html}</div>
    <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="after"></div></div>`).join('');
  bindSay(b);
  $$('.item',b).forEach(it=>{
    const q=items[+it.dataset.n];
    $$('.opt',it).forEach(o=>o.onclick=()=>{
      const ok=q.options[o.dataset.k]===q.answer;
      $$('.opt',it).forEach(x=>{x.disabled=true;if(q.options[x.dataset.k]===q.answer)x.classList.add('good');});
      if(!ok)o.classList.add('bad');
      tr.mark(ok);
      $('.after',it).innerHTML=(ok?'<span class="ok">✓ Правильно!</span> ':'<span class="no">✗ Ошибка.</span> ')+(q.after||'');
      bindSay($('.after',it));
      if(q.afterSay)speak(q.afterSay);
    });
  });
}
function qEnRu(w){return{html:`<span class="w">${esc(w.w)}</span> <span class="ip">${esc(w.ipa)}</span> ${sayBtn(w.w)}`,options:shuffle([w.ru,...others(w,3).map(x=>x.ru)]),answer:w.ru,afterSay:w.w,word:w};}
function qRuEn(w){return{html:`<span class="w">${esc(w.ru)}</span>`,options:shuffle([w.w,...others(w,3).map(x=>x.w)]),answer:w.w,after:`<b>${esc(w.w)}</b> ${esc(w.ipa)}`,afterSay:w.w,word:w};}
function qGap(w){return{html:`<span class="sent">${gapHtml(w)}</span>`,options:shuffle([w.ga.toLowerCase(),...others(w,3).map(x=>x.ga.toLowerCase())]),answer:w.ga.toLowerCase(),after:`<b>${esc(w.ex)}</b> ${sayBtn(w.ex)}<br><span class="tr">${esc(w.exRu)}</span>`,afterSay:w.ex,word:w};}

addSection('enru','Выбери перевод','Перевод EN→RU','Прочитай английское слово и выбери правильный перевод.',(b,s)=>choiceList(b,s,shuffle(W).map(qEnRu)));
addSection('ruen','Выбери английское слово','Слово RU→EN','Прочитай перевод и выбери английское слово.',(b,s)=>choiceList(b,s,shuffle(W).map(qRuEn)));

/* ---------- 5. matching ---------- */
addSection('match','Найди пару','Пары','Нажми на английское слово, потом на его перевод.',(b,s)=>{
  const all=shuffle(W),rounds=[];for(let k=0;k<all.length;k+=6)rounds.push(all.slice(k,k+6));
  let r=0,mistakes=0;const prog=$('.prog',s.el);prog.textContent='';NOLINK.classList.remove('ok');
  function show(){
    if(r>=rounds.length){prog.textContent=`Ошибок: ${mistakes}  `+(mistakes===0?'⭐⭐⭐':mistakes<=3?'⭐⭐':'⭐');NOLINK.classList.add('ok');
      b.innerHTML=`<div class="center"><div class="stars">${mistakes===0?'⭐⭐⭐':mistakes<=3?'⭐⭐':'⭐'}</div><p class="big">Все пары собраны! Ошибок: ${mistakes}</p></div>`;return;}
    const set=rounds[r],L=shuffle(set),R=shuffle(set);let sel=null,done=0;
    prog.textContent=`раунд ${r+1} / ${rounds.length} · ошибок: ${mistakes}`;
    b.innerHTML=`<div class="match"><div class="col">${L.map(w=>`<button class="tile" data-s="L" data-id="${w.id}">${esc(w.w)}</button>`).join('')}</div>
     <div class="col">${R.map(w=>`<button class="tile" data-s="R" data-id="${w.id}">${esc(w.ru)}</button>`).join('')}</div></div>`;
    $$('.tile[data-s=L]',b).forEach(t=>t.onclick=()=>{if(t.classList.contains('done'))return;$$('.tile[data-s=L]',b).forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=t;speak(t.textContent);});
    $$('.tile[data-s=R]',b).forEach(t=>t.onclick=()=>{
      if(!sel||t.classList.contains('done'))return;
      if(sel.dataset.id===t.dataset.id){[sel,t].forEach(x=>{x.classList.remove('sel');x.classList.add('done');});sel=null;done++;if(done===set.length){r++;setTimeout(show,700);}}
      else{mistakes++;prog.textContent=`раунд ${r+1} / ${rounds.length} · ошибок: ${mistakes}`;t.classList.add('bad','shake');setTimeout(()=>t.classList.remove('bad','shake'),500);}
    });
  }
  show();
});

addSection('gap','Вставь слово в предложение','Вставь слово','Выбери слово, которое подходит в пропуск.',(b,s)=>choiceList(b,s,shuffle(W).map(qGap)));

/* ---------- write list (7, 8) ---------- */
function writeList(b,s,mode){
  const items=shuffle(W),tr=tracker(s,items.length);
  b.innerHTML=items.map((w,n)=>`<div class="item" data-n="${n}"><div class="wr"><span class="num">${n+1}</span>
     ${mode==='listen'?`${sayBtn(w.w)}${sayBtn(w.w,1)}<span class="mask" style="flex:1 1 120px"></span>`:`<span class="ru">${esc(w.ru)} <span class="mask"></span></span>`}
     <span class="field"><input class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${mode==='listen'?'напиши, что слышишь':'по-английски'}">
     <button class="btn small" data-a="chk">✓</button><button class="btn alt small" data-a="hint" title="Подсказка">💡</button><button class="btn ghost small" data-a="show" title="Показать ответ">👁</button></span></div>
     <div class="after"></div></div>`).join('');
  bindSay(b);
  $$('.item',b).forEach(it=>{
    const w=items[+it.dataset.n],ans=core(w.w),inp=$('input',it),mask=$('.mask',it),after=$('.after',it);let tries=0,hints=0,done=false;
    const finish=(ok,clean)=>{done=true;inp.disabled=true;$$('button[data-a]',it).forEach(x=>x.disabled=true);
      inp.classList.add(ok?'good':'bad');tr.mark(clean);
      after.innerHTML=(ok?'<span class="ok">✓ Правильно!</span> ':'<span class="no">Правильно так:</span> ')+`<b>${esc(w.w)}</b> — ${esc(w.ru)}`;
      speak(w.w);
      const nx=$$('input:not(:disabled)',b)[0];if(nx&&ok)nx.focus({preventScroll:false});};
    const check=()=>{if(done)return;const v=core(inp.value);if(!v)return;
      if(v===ans)finish(true,tries===0&&hints===0);
      else{tries++;inp.classList.add('bad');setTimeout(()=>inp.classList.remove('bad'),600);
        if(tries>=2)finish(false,false);else after.innerHTML='<span class="no">Не так, попробуй ещё раз</span>';}};
    $('[data-a=chk]',it).onclick=check;
    $('[data-a=hint]',it).onclick=()=>{hints++;mask.innerHTML=maskOf(ans,Math.min(hints,ans.length));inp.focus();};
    $('[data-a=show]',it).onclick=()=>{if(!done)finish(false,false);};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
  });
}
addSection('write','Напиши слово','Напиши слово','Напиши английское слово по переводу (без to / a / an). Enter или ✓ — проверить, 💡 — подсказать букву.',(b,s)=>writeList(b,s,'write'));
addSection('listen','Слушай и пиши','Слушай и пиши','Нажми 🔊 (или 🐢 — медленно) и напиши слово, которое услышал.',(b,s)=>writeList(b,s,'listen'));

/* ---------- 9. build the sentence ---------- */
addSection('build','Собери предложение','Собери предложение','Нажимай на слова по порядку, чтобы получилось предложение. Нажми на слово в строке, чтобы убрать его.',(b,s)=>{
  const items=shuffle(W),tr=tracker(s,items.length);
  b.innerHTML=items.map((w,n)=>`<div class="item" data-n="${n}"><div class="qq"><span class="num">${n+1}</span><span>${esc(w.exRu)}</span></div><div class="line"></div><div class="bank"></div>
    <div class="row" style="justify-content:flex-start"><button class="btn small" data-a="chk" disabled>Проверить</button><button class="btn ghost small" data-a="clr">Сбросить</button></div><div class="after"></div></div>`).join('');
  $$('.item',b).forEach(it=>{
    const w=items[+it.dataset.n],target=w.ex.replace(/[.!?]$/,'').split(' '),mark=(w.ex.match(/[.!?]$/)||['.'])[0];
    let bank=shuffle(target.map(t=>({t}))),line=[],locked=false;
    const lineEl=$('.line',it),bankEl=$('.bank',it),chk=$('[data-a=chk]',it);
    function draw(){
      lineEl.innerHTML=line.map((c,k)=>`<button class="chip" data-k="${k}">${esc(c.t)}</button>`).join('')+(line.length===target.length?`<span>${esc(mark)}</span>`:'');
      bankEl.innerHTML=bank.map((c,k)=>`<button class="chip" data-b="${k}">${esc(c.t)}</button>`).join('');
      chk.disabled=locked||line.length<target.length;
      if(locked)return;
      $$('[data-b]',bankEl).forEach(x=>x.onclick=()=>{line.push(bank.splice(+x.dataset.b,1)[0]);draw();});
      $$('[data-k]',lineEl).forEach(x=>x.onclick=()=>{bank.push(line.splice(+x.dataset.k,1)[0]);draw();});
    }
    $('[data-a=clr]',it).onclick=()=>{if(locked)return;bank=shuffle(target.map(t=>({t})));line=[];draw();};
    chk.onclick=()=>{
      const ok=line.map(c=>c.t).join(' ').toLowerCase()===target.join(' ').toLowerCase();
      locked=true;draw();$('[data-a=clr]',it).disabled=true;tr.mark(ok);
      lineEl.classList.add(ok?'good':'bad');
      $('.after',it).innerHTML=ok?`<span class="ok">✓ Отлично!</span> ${sayBtn(w.ex)}`:`<span class="no">Не совсем. Правильно:</span><div class="answer">${esc(w.ex)} ${sayBtn(w.ex)}</div>`;
      bindSay($('.after',it));speak(w.ex);
    };
    draw();
  });
});

/* ---------- 10. translate ---------- */
addSection('tr','Переведи предложение','Переведи','Переведи предложение на английский. Если не уверен — нажми 💡, там будет нужное слово.',(b,s)=>{
  const items=shuffle(W),tr=tracker(s,items.length);
  b.innerHTML=items.map((w,n)=>`<div class="item" data-n="${n}"><div class="qq"><span class="num">${n+1}</span><span>${esc(w.exRu)}</span></div>
    <textarea class="inp" rows="2" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="Напиши по-английски…"></textarea>
    <div class="row" style="justify-content:flex-start" data-r="btns"><button class="btn small" data-a="chk">Проверить</button><button class="btn alt small" data-a="hint">💡 Подсказка</button><button class="btn ghost small" data-a="show">Показать ответ</button></div><div class="after"></div></div>`).join('');
  $$('.item',b).forEach(it=>{
    const w=items[+it.dataset.n],inp=$('textarea',it),after=$('.after',it),btns=$('[data-r=btns]',it);let done=false;
    const lock=(ok)=>{done=true;inp.disabled=true;inp.classList.add(ok?'good':'bad');tr.mark(ok);};
    const compare=(msg)=>{
      after.innerHTML=`<span class="no">${msg}</span><div class="answer">${esc(w.ex)} ${sayBtn(w.ex)}</div>`;bindSay(after);speak(w.ex);
      btns.innerHTML='<button class="btn small" data-a="same">✅ У меня так же</button><button class="btn ghost small" data-a="err">❌ Я ошибся</button>';
      $('[data-a=same]',btns).onclick=()=>{lock(true);btns.innerHTML='';};
      $('[data-a=err]',btns).onclick=()=>{lock(false);btns.innerHTML='';};
    };
    $('[data-a=hint]',it).onclick=()=>{if(!$('.note',it.querySelector('.qq')))it.querySelector('.qq').insertAdjacentHTML('beforeend',`<span class="note">нужное слово: <b>${esc(w.w)}</b> — ${esc(w.ru)}</span>`);};
    $('[data-a=chk]',it).onclick=()=>{
      if(done||!inp.value.trim())return;
      if(normSent(inp.value)===normSent(w.ex)){lock(true);btns.innerHTML='';after.innerHTML=`<span class="ok">✓ Отлично!</span> ${sayBtn(w.ex)}`;bindSay(after);speak(w.ex);}
      else compare('Сравни со своим вариантом:');
    };
    $('[data-a=show]',it).onclick=()=>{if(!done)compare('Правильный ответ:');};
    inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const c=$('[data-a=chk]',it);if(c)c.click();}};
  });
});

/* ---------- 11. final test ---------- */
addSection('test','Итоговый тест','🏆 Тест',`${TEST_N} вопросов вперемешку: перевод, слово, пропуск. Без подсказок!`,(b,s)=>{
  const prog=$('.prog',s.el);prog.textContent='';NOLINK.classList.remove('ok');
  b.innerHTML=`<div class="center"><button class="btn alt" style="font-size:20px;padding:14px 26px">🏆 Начать тест</button></div>`;
  $('button',b).onclick=()=>{
    const gens=[qEnRu,qRuEn,qGap];const qs=shuffle(shuffle(W).slice(0,TEST_N).map((w,k)=>gens[k%3](w)));
    let i=0,score=0;const wrong=[];
    function show(){
      if(i>=qs.length){const p=score/qs.length;prog.textContent=`✅ ${score} / ${qs.length}  ${stars(p)}`;NOLINK.classList.add('ok');
        const mark=p>=.9?5:p>=.7?4:p>=.5?3:2;
        b.innerHTML=`<div class="center"><div class="stars">${stars(p)}</div><p class="big">${score} из ${qs.length} · оценка ${mark}</p>
          ${wrong.length?`<p style="color:#7a7468">Повтори эти слова:</p><p>${wrong.map(w=>`<b>${esc(w.w)}</b> — ${esc(w.ru)}`).join('<br>')}</p>`:'<p>Ни одной ошибки! 🎉</p>'}</div>`;
        return;}
      const q=qs[i];
      b.innerHTML=`<div class="bar"><div style="width:${i/qs.length*100}%"></div></div><div class="counter">Вопрос ${i+1} из ${qs.length} · ✅ ${score}</div>
        <div class="tq">${q.html}</div><div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="after" style="text-align:center"></div>`;
      bindSay(b);
      $$('.opt',b).forEach(o=>o.onclick=()=>{
        const ok=q.options[o.dataset.k]===q.answer;
        $$('.opt',b).forEach(x=>{x.disabled=true;if(q.options[x.dataset.k]===q.answer)x.classList.add('good');});
        if(ok)score++;else{o.classList.add('bad');wrong.push(q.word);}
        setTimeout(()=>{i++;show();},ok?800:1800);
      });
    }
    show();
  };
});

buildPage();
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const c=$('#cards'),r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  if(e.key==='ArrowRight')$('[data-a=nx]',c).click();
  if(e.key==='ArrowLeft')$('[data-a=pv]',c).click();
});
